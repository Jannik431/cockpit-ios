name: Cockpit

options:
  bundleIdPrefix: de.jannikpasch
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: 8H492ZU48P
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Cockpit:
    type: application
    platform: iOS
    sources:
      - path: Cockpit
    entitlements:
      path: Cockpit/Cockpit.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.jannikpasch.cockpit
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cockpit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Cockpit liest Schlaf, HRV, Ruhepuls und Trainings aus Apple Health, um sie mit deiner persönlichen Norm zu vergleichen. Die Daten bleiben auf diesem iPhone."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  CockpitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CockpitTests
    dependencies:
      - target: Cockpit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.jannikpasch.cockpit.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cockpit.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Cockpit"

schemes:
  Cockpit:
    build:
      targets:
        Cockpit: all
        CockpitTests: [test]
    test:
      targets:
        - CockpitTests
